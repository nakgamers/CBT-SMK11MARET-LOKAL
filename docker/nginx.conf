# nginx di container Railway: dengar di 8080, root = public/,
# PHP lewat socket php-fpm. Rewrite ala CodeIgniter 4.
server {
    listen 8080;
    server_name _;
    root /app/public;
    index index.php;

    client_max_body_size 25m;   # upload Excel / gambar soal

    # aset statis: cache + jangan dieksekusi
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # semua request lain -> index.php (CI4 tanpa index.php di URL)
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        # snippet fastcgi-php.conf tidak ada di image Debian (bawaan paket
        # php-fpm Ubuntu), jadi parameternya ditulis lengkap di sini.
        include fastcgi_params;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        # Railway edge mengakhiri TLS lalu meneruskan http ke container;
        # tanpa header ini CI4 mengira sitenya http -> aset mixed-content.
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_read_timeout 300s;
    }

    # tolak file tersembunyi (.env, .git)
    location ~ /\. {
        deny all;
    }
}
