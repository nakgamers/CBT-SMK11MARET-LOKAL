; Pool php-fpm untuk container CBT (menimpa www.conf bawaan image).
; listen  = socket unix yang sama dipakai docker/nginx.conf
; clear_env = no -> variabel Railway (kredensial DB) diteruskan ke worker
[www]
user = www-data
group = www-data
listen = /run/php/php-fpm.sock
listen.owner = www-data
listen.group = www-data
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
clear_env = no
catch_workers_output = yes
