; Pool php-fpm untuk container CBT (menimpa www.conf bawaan image).
; listen  = socket unix yang sama dipakai docker/nginx.conf
; clear_env = no -> variabel Railway (kredensial DB) diteruskan ke worker
[www]
user = www-data
group = www-data
listen = /run/php/php-fpm.sock
listen.owner = www-data
listen.group = www-data
pm = dynamic
; Server lab punya 12 core / 15 GB RAM. pm.max_children = 10 terlalu mepet:
; saat ratusan siswa ujian + autosave bersamaan, seluruh worker habis
; terpakai request POST /siswa/jawab, dan request admin (yang berbobot sama)
; ikut mengantri -> browser admin putih/blank. Naikkan jadi 60 worker.
pm.max_children = 60
pm.start_servers = 6
pm.min_spare_servers = 4
pm.max_spare_servers = 12
clear_env = no
catch_workers_output = yes
